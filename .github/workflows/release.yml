name: Release & Multi-Platform Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Testes de segurança e persistência
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./... -count=1
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
  build:
    name: Build Binaries
    needs: tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [windows, linux, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          version = re.search(r'const CurrentVersion = "([0-9]+\.[0-9]+\.[0-9]+)"', pathlib.Path('pkg/updater/updater.go').read_text()).group(1)
          ref = os.environ['GITHUB_REF']
          if ref.startswith('refs/tags/') and ref != 'refs/tags/v' + version:
              raise SystemExit('A tag difere da versão compilada; build recusado.')
          PY
          BINARY_NAME="kofre-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi
          mkdir -p dist
          go build -ldflags="-s -w" -o "dist/${BINARY_NAME}" ./cmd/kofre

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kofre-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*


  # A publicação exige assinatura local pelo release-sign antes do publisher.
  # O CI não recebe chave privada e entrega apenas artifacts para conferência.
